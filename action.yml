name: Swift Codecov Upload Action
description: A GitHub Action which performs Codecov.io uploads with additional support for Swift projects.
branding:
  icon: feather
  color: orange

inputs:
  package_path:
    description: The location of the repository. Defaults to $GITHUB_WORKSPACE. This will be used as the working_directory for the Codecov upload action.
    required: false
    # N.B.: Can not simply default to github.workspace here, as it will not be correctly updated when the action is called from
    # within a job which runs in a container.
    default: ''
  build_parameters:
    description: Additional parameters needed by swift build and swift test to disambiguate the correct target and configuration, i.e. -c release. Only flags which affect the output binary path are required.
    required: false
    default: ''
  codecov_token:
    description: The Codecov token for the repository.
    required: false
    default: ''
  # The following are passthrough parameters for the Codecov upload action.
  fail_ci_if_error: { description: 'See https://github.com/codecov/codecov-action#arguments', required: false, default: '' }
  verbose:          { description: 'See https://github.com/codecov/codecov-action#arguments', required: false, default: '' }
  dry_run:          { description: 'See https://github.com/codecov/codecov-action#arguments', required: false, default: '' }
  flags:            { description: 'See https://github.com/codecov/codecov-action#arguments', required: false, default: '' }
  env_vars:         { description: 'See https://github.com/codecov/codecov-action#arguments', required: false, default: '' }

runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    
    - id: determine-package-info
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package_path != '' && format('--package-path={0}', inputs.package_path) || '' }}
        BUILD_PARAMETERS: ${{ inputs.build_parameters }}
      run: |
        build_args=()
        if [ -n "$BUILD_PARAMETERS" ]; then
          read -r -d '' -a build_args <<< "$BUILD_PARAMETERS" || true
        fi
        binpath="$(swift build ${PACKAGE_PATH:+"$PACKAGE_PATH"} ${build_args[@]+"${build_args[@]}"} --show-bin-path)"
        pkgname="$(swift package ${PACKAGE_PATH:+"$PACKAGE_PATH"} describe --type json | fgrep -v 'Found unhandled resource at' | perl -e 'use JSON::PP; print (decode_json(join("",(<>)))->{name});')"
        excname="${pkgname}PackageTests.xctest"; [[ -d "${binpath}/${excname}" ]] && excname+="/Contents/macOS/${excname%*.xctest}"

        # https://github.com/apple/swift-package-manager/issues/5853 - broken by 5.8, fixed in 5.9
        if [[ "$(swift package --version)" =~ 5\.8\.[0-9]+$ ]]; then
            covpath="${binpath}/codecov"
        else
            codecov_path="$(swift test ${PACKAGE_PATH:+"$PACKAGE_PATH"} ${build_args[@]+"${build_args[@]}"} --show-codecov-path)" || true
            covpath="$(dirname "$codecov_path")"
        fi

        cov_object="$(printf '%s' "${binpath}/${excname}" | tr -d '\n\r')"
        cov_data="$(printf '%s' "${covpath}/default.profdata" | tr -d '\n\r')"
        echo "COVERAGE_OBJECT=${cov_object}" >>"${GITHUB_ENV}"
        echo "COVERAGE_DATA=${cov_data}" >>"${GITHUB_ENV}"

    - id: convert-coverage-report
      env:
        PACKAGE_PATH:  ${{ inputs.package_path     != '' && format('{0}/',                    inputs.package_path)     || '' }}
        TOKEN:         ${{ inputs.codecov_token }}
        IN_PACKAGE_PATH: ${{ inputs.package_path }}
        IN_RAISEERR:   ${{ inputs.fail_ci_if_error }}
        IN_VERBOSE:    ${{ inputs.verbose }}
        IN_DRY_RUN:    ${{ inputs.dry_run }}
        IN_FLAGS:      ${{ inputs.flags }}
        IN_ENVVARS:    ${{ inputs.env_vars }}
      shell: bash
      run: |
        $(which xcrun || true) llvm-cov show \
            --format=text \
            --ignore-filename-regex='/\.build/.*' \
            --instr-profile="${COVERAGE_DATA}" \
            "${COVERAGE_OBJECT}" \
            >"${PACKAGE_PATH}codecov.txt"

        # Strip newlines/control characters and JSON-escape a value.
        json_escape() {
          local v
          v="$(printf '%s' "$1" | tr -d '\000-\037')"
          v="${v//\\/\\\\}"
          v="${v//\"/\\\"}"
          printf '%s' "$v"
        }
        # Emit a boolean-like value as a JSON literal when it is true/false, else as a JSON string.
        json_value() {
          case "$1" in
            true|false) printf '%s' "$1" ;;
            *) printf '"%s"' "$(json_escape "$1")" ;;
          esac
        }

        extra=""
        if [ -n "$IN_PACKAGE_PATH" ]; then extra+=",\"root_dir\":\"$(json_escape "$IN_PACKAGE_PATH")\""; fi
        if [ -n "$IN_FLAGS" ];        then extra+=",\"flags\":\"$(json_escape "$IN_FLAGS")\""; fi
        if [ -n "$IN_ENVVARS" ];      then extra+=",\"env_vars\":\"$(json_escape "$IN_ENVVARS")\""; fi
        if [ -n "$IN_RAISEERR" ];     then extra+=",\"fail_ci_if_error\":$(json_value "$IN_RAISEERR")"; fi
        if [ -n "$IN_VERBOSE" ];      then extra+=",\"verbose\":$(json_value "$IN_VERBOSE")"; fi
        if [ -n "$IN_DRY_RUN" ];      then extra+=",\"dry_run\":$(json_value "$IN_DRY_RUN")"; fi

        safe_token="$(json_escape "$TOKEN")"
        safe_path="$(json_escape "$PACKAGE_PATH")"
        printf 'params={"token":"%s","files":"codecov.txt","disable_search":true,"working-directory":"%s"%s}\n' \
          "${safe_token}" \
          "${safe_path}" \
          "${extra}" \
          >>"${GITHUB_OUTPUT}"

    - id: upload-coverage-report
      uses: chainguard-actions/codecov-codecov-action@20ca176a5e3c2933b049704587fd31697ce58a99 # v5
      with: ${{ fromJSON(steps.convert-coverage-report.outputs.params) }}
