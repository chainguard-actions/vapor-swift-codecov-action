name: test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push: { branches: [ 'main' ] }
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-containerized-toplevel:
    strategy:
      fail-fast: false
      matrix:
        swift: 
          - swift:6.1-noble
          - swiftlang/swift:nightly-main-noble
    runs-on: ubuntu-latest
    container: ${{ matrix.swift }}
    steps:
      - run: apt-get update -y && apt-get install -y curl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test --enable-code-coverage
      - uses: vapor/swift-codecov-action@ec2b969bbc9b14673fce69467db6ea2fca401e52 # main
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          dry_run: true
          verbose: true

  linux-containerized-subpath:
    strategy:
      fail-fast: false
      matrix:
        swift:
          - swift:6.1-noble
          - swiftlang/swift:nightly-main-noble
    runs-on: ubuntu-latest
    container: ${{ matrix.swift }}
    steps:
      - run: apt-get update -y && apt-get install -y curl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test --package-path sample-coverage-data --enable-code-coverage
      - uses: vapor/swift-codecov-action@ec2b969bbc9b14673fce69467db6ea2fca401e52 # main
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          dry_run: true
          verbose: true
          package_path: sample-coverage-data

  macos-toplevel:
    runs-on: macos-15
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with: { xcode-version: latest-stable }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test --enable-code-coverage
      - uses: vapor/swift-codecov-action@ec2b969bbc9b14673fce69467db6ea2fca401e52 # main
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          dry_run: true
          verbose: true

  macos-subpath:
    runs-on: macos-15
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with: { xcode-version: latest-stable }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test --package-path sample-coverage-data --enable-code-coverage
      - uses: vapor/swift-codecov-action@ec2b969bbc9b14673fce69467db6ea2fca401e52 # main
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          dry_run: true
          verbose: true
          package_path: sample-coverage-data

  windows:
    runs-on: windows-latest
    steps:
      - name: Configure dev environment
        uses: compnerd/gha-setup-vsdevenv@452f99effa381b81c025ccfbdccaca509bff1b29 # main
        with:
          toolset_version: 14.29
          winsdk: 10.0.22621.0
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # main
        with: { branch: 'swift-6.0.3-release', tag: '6.0.3-RELEASE' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          swift test -Xbuild-tools-swiftc -windows-sdk-root -Xbuild-tools-swiftc "${env:WindowsSdkDir}" -Xbuild-tools-swiftc -windows-sdk-version -Xbuild-tools-swiftc ${env:UCRTVersion} -Xswiftc -windows-sdk-root -Xswiftc "${env:WindowsSdkDir}" -Xswiftc -windows-sdk-version -Xswiftc ${env:UCRTVersion} --package-path sample-coverage-data --enable-code-coverage
      - uses: vapor/swift-codecov-action@ec2b969bbc9b14673fce69467db6ea2fca401e52 # main
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          dry_run: true
          verbose: true
          package_path: sample-coverage-data
