name: Test passthrough inputs (name, override_branch, override_build, override_build_url, override_commit, override_pr, swift_project)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "my-coverage-upload"
          override_branch: "main"
          override_build: "42"
          override_build_url: "https://example.com/build/42"
          override_commit: "abc1234567890"
          override_pr: "99"
          swift_project: "MySwiftProject"
          dry_run: "true"
      - name: Assert action ran (Swift not available, graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Swift toolchain not available in runner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
