name: Test package_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy package directory
        run: |
          mkdir -p /tmp/swift-pkg

      - id: action
        uses: .
        continue-on-error: true
        with:
          package_path: '/tmp/swift-pkg'
          codecov_token: ''
          dry_run: 'true'

      - name: Assert action ran with package_path (fails gracefully without Swift)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom package_path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Swift toolchain not available or package not a valid Swift package)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
