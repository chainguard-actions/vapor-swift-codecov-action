name: Test package_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Swift package structure for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mypackage/Sources/MyLib"
          cat > "$GITHUB_WORKSPACE/mypackage/Package.swift" << 'EOF'
          // swift-tools-version:5.5
          import PackageDescription
          let package = Package(
              name: "MyLib",
              targets: [
                  .target(name: "MyLib", path: "Sources/MyLib"),
              ]
          )
          EOF
          echo "// placeholder" > "$GITHUB_WORKSPACE/mypackage/Sources/MyLib/MyLib.swift"

      - id: action
        uses: .
        continue-on-error: true
        with:
          package_path: '${{ github.workspace }}/mypackage'
          codecov_token: ''
          dry_run: 'true'

      - name: Assert action ran with package_path (fails gracefully without Swift)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with package_path set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Swift toolchain not available, as expected in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
