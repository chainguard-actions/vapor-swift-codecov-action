name: Test passthrough inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          base_sha: abc1234
          codecov_yml_path: .codecov.yml
          disable_file_fixes: 'true'
          disable_telem: 'true'
          env_vars: OS,SWIFT_VERSION
          flags: unittests
          name: swift-coverage
          override_branch: main
          override_build: '42'
          override_build_url: 'https://example.com/build/42'
          override_commit: abc1234def5678
          override_pr: '7'
          swift_project: MyProject
          dry_run: 'true'

      - name: Assert action ran (Swift not available, graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Swift toolchain not available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
