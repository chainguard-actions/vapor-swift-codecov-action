name: Test passthrough params (env_vars, fail_ci_if_error, name, swift_project)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          env_vars: "OS,SWIFT_VERSION"
          fail_ci_if_error: "false"
          name: "my-coverage-upload"
          swift_project: "MyProject"
          dry_run: "true"
      - name: Assert action ran (expected to fail without Swift toolchain/package)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with passthrough params (env_vars, fail_ci_if_error, name, swift_project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
