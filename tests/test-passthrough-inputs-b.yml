name: Test passthrough inputs (override_branch, override_build, override_build_url, override_commit, override_pr, swift_project)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          override_branch: 'main'
          override_build: '42'
          override_build_url: 'https://example.com/build/42'
          override_commit: 'abc1234def5678'
          override_pr: '99'
          swift_project: 'MyProject'

      - name: Assert action ran with override passthrough inputs (fails gracefully without Swift project)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a Swift toolchain, the action fails at 'determine-package-info'.
          # We verify the action did not produce an unexpected (skipped) outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
