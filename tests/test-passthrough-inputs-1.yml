name: Test passthrough inputs (base_sha, codecov_yml_path, disable_file_fixes, disable_telem, env_vars, fail_ci_if_error)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          base_sha: "abc1234"
          codecov_yml_path: ".codecov.yml"
          disable_file_fixes: "true"
          disable_telem: "true"
          env_vars: "OS,SWIFT_VERSION"
          fail_ci_if_error: "false"
          dry_run: "true"
      - name: Assert action ran (Swift not available, graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Swift toolchain not available in runner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
