name: Test dry-run input passthrough
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal Swift package fixture and mock tools
      - name: Install mock Swift toolchain and create fixtures
        run: |
          mkdir -p /tmp/mock-bin
          mkdir -p /tmp/swiftpkg/.build/debug/codecov
          mkdir -p /tmp/swiftpkg/Sources/MyLib
          mkdir -p /tmp/swiftpkg/Tests/MyLibTests

          # Create fake coverage data files
          echo '{}' > /tmp/swiftpkg/.build/debug/codecov/MyLib.json
          echo 'fake profdata' > /tmp/swiftpkg/.build/debug/codecov/default.profdata

          # Create a fake xctest binary
          touch /tmp/swiftpkg/.build/debug/MyLibPackageTests.xctest
          chmod +x /tmp/swiftpkg/.build/debug/MyLibPackageTests.xctest

          # Mock 'swift' binary using printf
          printf '%s\n' '#!/bin/sh' \
            'case "$*" in' \
            '  *--show-codecov-path*)' \
            '    echo "/tmp/swiftpkg/.build/debug/codecov/MyLib.json"' \
            '    ;;' \
            '  *--show-bin-path*)' \
            '    echo "/tmp/swiftpkg/.build/debug"' \
            '    ;;' \
            '  *describe*--type*json*)' \
            '    echo '"'"'{"name":"MyLib","targets":[]}'"'"'' \
            '    ;;' \
            '  *)' \
            '    echo "mock swift: $*" >&2' \
            '    ;;' \
            'esac' \
            'exit 0' > /tmp/mock-bin/swift
          chmod +x /tmp/mock-bin/swift

          # Mock llvm-cov
          printf '%s\n' '#!/bin/sh' \
            'echo "# mock coverage data"' \
            'exit 0' > /tmp/mock-bin/llvm-cov
          chmod +x /tmp/mock-bin/llvm-cov

          # Mock xcrun (macOS tool, not needed on Linux but action calls it)
          printf '%s\n' '#!/bin/sh' \
            'exec "$@"' > /tmp/mock-bin/xcrun
          chmod +x /tmp/mock-bin/xcrun

          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          package_path: /tmp/swiftpkg
          dry_run: 'true'
          codecov_token: 'test-token-dry-run'
          name: 'test-coverage-upload'
        continue-on-error: true

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # With mocked tools, the action should succeed or fail at the codecov upload step.
          # We accept both success and failure (codecov upload may fail without real token/coverage).
          # The key assertion is that the action was invoked and ran through the params step.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"
