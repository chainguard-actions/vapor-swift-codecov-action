name: Test extra passthrough parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          base_sha: ''
          codecov_yml_path: ''
          disable_file_fixes: 'false'
          env_vars: ''
          override_branch: 'main'
          override_build: '1'
          override_build_url: 'https://example.com/build/1'
          override_commit: ''
          override_pr: ''
          swift_project: ''
          dry_run: 'true'

      - name: Assert action ran (success or graceful failure without Swift project)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
