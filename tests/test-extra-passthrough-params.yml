name: Test extra passthrough parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          base_sha: abc1234
          codecov_yml_path: .codecov.yml
          disable_file_fixes: 'true'
          env_vars: OS,SWIFT_VERSION
          override_branch: main
          override_build: '42'
          override_build_url: https://example.com/build/42
          override_commit: abc1234def5678
          override_pr: '7'
          swift_project: MyProject
          dry_run: 'true'

      - name: Assert action ran (fails gracefully without Swift environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action requires a Swift toolchain and a real Swift package.
          # In the test environment (no Swift, no Swift package), it is expected
          # to fail at the 'determine-package-info' step. We accept either
          # success or failure as long as the step did not produce an unexpected
          # outcome (e.g. skipped).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with extra passthrough inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
