name: Test passthrough inputs (set A)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          base_sha: "abc1234"
          codecov_yml_path: ".codecov.yml"
          disable_file_fixes: "true"
          disable_telem: "true"
          env_vars: "OS,SWIFT_VERSION"
          flags: "unittests"
          name: "my-upload"
          override_branch: "main"
          dry_run: "true"
      - name: Assert action ran (fails gracefully without Swift environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Swift environment available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
