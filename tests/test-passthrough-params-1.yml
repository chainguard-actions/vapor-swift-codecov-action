name: Test passthrough params (base_sha, codecov_yml_path, disable_file_fixes, disable_telem)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          base_sha: "abc1234"
          codecov_yml_path: ".codecov.yml"
          disable_file_fixes: "true"
          disable_telem: "true"
          dry_run: "true"
      - name: Assert action ran (expected to fail without Swift toolchain/package)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with passthrough params (base_sha, codecov_yml_path, disable_file_fixes, disable_telem)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
