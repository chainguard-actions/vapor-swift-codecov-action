name: Test basic usage (no Swift available)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          codecov_token: ''
          dry_run: 'true'

      - name: Assert action ran (fails gracefully without Swift toolchain)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (Swift toolchain available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Swift toolchain not available, as expected in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
