name: Test basic invocation (no Swift project)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'

      - name: Assert action ran (fails gracefully without Swift project)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a Swift project/toolchain, the action is expected to fail
          # at the 'determine-package-info' step. We just verify it didn't
          # produce an unexpected outcome (skipped would be a bug).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (expected failure without Swift project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
