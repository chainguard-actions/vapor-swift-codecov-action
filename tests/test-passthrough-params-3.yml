name: Test passthrough params (override_branch, override_build, override_build_url, override_commit, override_pr)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          override_branch: "main"
          override_build: "42"
          override_build_url: "https://example.com/build/42"
          override_commit: "abc1234def5678"
          override_pr: "99"
          dry_run: "true"
      - name: Assert action ran (expected to fail without Swift toolchain/package)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with passthrough params (override_branch, override_build, override_build_url, override_commit, override_pr)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
